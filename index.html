<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AInvoice — Premium Locum Hub</title>
    <!-- Premium Google Fonts Engine -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @media print { 
            .no-print { display: none !important; } 
            body { background: white !important; color: #0f172a !important; padding: 0 !important; }
            .print-card { box-shadow: none !important; border: none !important; background: transparent !important; padding: 0 !important; }
            .print-clean-input { border: none !important; background: transparent !important; padding: 0 !important; color: #0f172a !important; }
        }
    </style>
</head>
<body class="bg-[#090a0f] min-h-screen text-slate-200 selection:bg-violet-500/30 antialiased pb-16">

    <!-- Subtle Premium Background Glow Overlays -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-[500px] bg-gradient-to-b from-violet-600/10 via-indigo-600/5 to-transparent pointer-events-none blur-[120px]"></div>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 relative z-10">
        
        <!-- Header Brand Navigation -->
        <header class="no-print flex flex-col sm:flex-row items-center justify-between gap-4 mb-10 bg-[#11131e]/60 border border-white/[0.04] rounded-2xl p-4 shadow-2xl backdrop-blur-xl">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-violet-500 via-purple-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-500/20">
                    <span class="font-display font-extrabold text-lg tracking-tighter text-white">A</span>
                </div>
                <div>
                    <h1 class="text-lg font-display font-bold tracking-tight text-white">AInvoice</h1>
                    <p class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">Pharmacy Locum Suite</p>
                </div>
            </div>
            
            <nav class="flex items-center bg-black/40 p-1 rounded-xl border border-white/[0.04]">
                <button onclick="switchTab('generator')" id="tab-generator" class="px-4 py-2 rounded-lg text-xs font-semibold tracking-wide transition-all duration-200 bg-white text-black shadow-md">
                    ⚡ Fast Invoice
                </button>
                <button onclick="switchTab('profile')" id="tab-profile" class="px-4 py-2 rounded-lg text-xs font-semibold tracking-wide transition-all duration-200 text-slate-400 hover:text-slate-200">
                    ⚙️ Settings & Bank
                </button>
            </nav>

            <button onclick="window.print()" class="w-full sm:w-auto bg-gradient-to-r from-violet-500 to-indigo-600 hover:from-violet-600 hover:to-indigo-700 text-white font-semibold text-xs tracking-wider uppercase py-3 px-6 rounded-xl shadow-lg shadow-violet-500/20 active:scale-[0.98] transition-all">
                Export Statement
            </button>
        </header>

        <main class="grid grid-cols-1 gap-6">

            <!-- CONFIGURATION PANEL (Settings Hub) -->
            <section id="panel-profile" class="no-print hidden bg-[#11131e]/40 border border-white/[0.04] rounded-3xl p-6 shadow-2xl backdrop-blur-xl space-y-6">
                <div>
                    <h2 class="text-base font-display font-bold text-white tracking-tight">⚙️ Locum Setup & Configuration</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Your parameters load dynamically into the statement viewport on modification.</p>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-black/20 border border-white/[0.02] p-5 rounded-2xl space-y-4">
                        <h3 class="text-[10px] font-bold uppercase tracking-widest text-violet-400 font-display">Professional Identity</h3>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Your Full Name</label>
                            <input type="text" id="cfg-name" placeholder="John Doe MRPharmS" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2.5 text-sm focus:border-violet-500 outline-none transition-all text-white">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">GPhC Registration Number</label>
                            <input type="text" id="cfg-gphc" placeholder="e.g. 2012345" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2.5 text-sm focus:border-violet-500 outline-none transition-all font-mono text-white">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Your Business Address</label>
                            <textarea id="cfg-address" rows="2" placeholder="Street Address, Postcode" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2 text-sm focus:border-violet-500 outline-none transition-all resize-none text-white"></textarea>
                        </div>
                    </div>

                    <div class="bg-black/20 border border-white/[0.02] p-5 rounded-2xl space-y-4">
                        <h3 class="text-[10px] font-bold uppercase tracking-widest text-indigo-400 font-display">Bank Remittance Accounts</h3>
                        <div class="space-y-1.5">
                            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Bank Name</label>
                            <input type="text" id="cfg-bank" placeholder="e.g. Barclays Bank" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2.5 text-sm focus:border-violet-500 outline-none transition-all text-white">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Account Number</label>
                                <input type="text" id="cfg-acc" placeholder="8 digits" maxlength="8" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2.5 text-sm focus:border-violet-500 outline-none transition-all font-mono text-white">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Sort Code</label>
                                <input type="text" id="cfg-sort" placeholder="00-00-00" maxlength="8" class="w-full bg-[#161926]/50 border border-white/[0.05] rounded-xl px-4 py-2.5 text-sm focus:border-violet-500 outline-none transition-all font-mono text-white">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- CORE INVOICE GENERATOR VIEWPORT -->
            <section id="panel-generator" class="bg-[#11131e] text-slate-200 rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/[0.04] print-card">
                
                <!-- PRINT EXPORT BRANDING BAR -->
                <div class="hidden print:flex items-center justify-between border-b border-slate-200 pb-6 mb-8">
                    <div>
                        <h2 class="text-2xl font-display font-black tracking-tight text-slate-900">AInvoice</h2>
                        <p class="text-xs text-slate-500 font-medium">Professional Locum Remittance Statement</p>
                    </div>
                    <div class="text-right">
                        <h3 id="print-lbl-name" class="font-bold text-base text-slate-800"></h3>
                        <p id="print-lbl-gphc" class="text-xs font-mono text-slate-500"></p>
                    </div>
                </div>

                <!-- METADATA INFORMATION BAR -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 border-b border-white/[0.04] pb-6">
                    <div class="space-y-1">
                        <span class="text-[10px] font-bold text-violet-400 uppercase tracking-widest block font-display print:text-slate-400">Locum Statement Origin</span>
                        <div>
                            <p id="lbl-name" class="font-display font-bold text-base text-white block print:text-slate-800">Set Profile In Settings</p>
                            <p id="lbl-gphc" class="text-xs font-mono text-slate-400 block mt-0.5 print:text-slate-600"></p>
                            <p id="lbl-address" class="text-xs text-slate-400 whitespace-pre-line mt-2 block print:text-slate-600"></p>
                        </div>
                    </div>
