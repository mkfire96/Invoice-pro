<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK Invoicing</title>
    <!-- Tailwind CSS for polished layouts -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @media print { 
            .no-print { display: none !important; } 
            body { background: white !important; color: black !important; padding: 0 !important; }
            .print-border { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-3 md:p-8 text-gray-800">

    <div class="max-w-3xl mx-auto bg-white shadow-sm rounded-xl p-4 md:p-8 border border-gray-200 print-border">
        
        <!-- App Control Header (Hidden when printing/saving PDF) -->
        <div class="no-print flex justify-between items-center border-b pb-4 mb-6">
            <h1 class="font-bold text-lg text-slate-800">📋 MMK Invoicing</h1>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2 px-4 rounded-lg shadow-sm active:scale-95 transition-all">
                Print / Save PDF
            </button>
        </div>

        <!-- Metadata & Profile Form Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="space-y-2">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Your Details</span>
                <input type="text" id="name" placeholder="Your Full Name" class="w-full font-semibold text-gray-800 border-b border-gray-200 focus:border-blue-500 outline-none pb-1 bg-transparent">
                <input type="text" id="gphc" placeholder="GPhC Registration Number" class="w-full text-sm text-gray-600 border-b border-gray-200 focus:border-blue-500 outline-none pb-1 bg-transparent">
                <textarea id="address" placeholder="Your Address & Contact Info" rows="2" class="w-full text-sm text-gray-600 border-b border-gray-200 focus:border-blue-500 outline-none resize-none bg-transparent"></textarea>
            </div>
            <div class="space-y-2 md:text-right flex flex-col justify-between">
                <div>
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Invoice Meta</span>
                    <div class="flex justify-between md:justify-end gap-2 text-sm">
                        <span class="text-gray-400">Inv #:</span>
                        <input type="text" id="invNum" placeholder="INV-001" class="w-24 md:text-right font-mono border-b border-gray-200 outline-none bg-transparent">
                    </div>
                    <div class="flex justify-between md:justify-end gap-2 text-sm mt-1">
                        <span class="text-gray-400">Date:</span>
                        <input type="date" id="invDate" class="w-32 md:text-right border-b border-gray-200 outline-none bg-transparent text-gray-600">
                    </div>
                </div>
            </div>
        </div>

        <!-- Pharmacy Client Information -->
        <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-gray-100">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Bill To (Pharmacy Company)</span>
            <input type="text" id="client" placeholder="Company Name / Branch Code (e.g. Boots 1234)" class="w-full bg-transparent font-medium text-gray-800 border-b border-gray-200 focus:border-blue-500 outline-none pb-1 mb-2">
            <input type="text" id="clientAddr" placeholder="Pharmacy Site Address" class="w-full bg-transparent text-sm text-gray-600 border-b border-gray-200 focus:border-blue-500 outline-none pb-1">
        </div>

        <!-- Shift Items Dynamic Entry Grid -->
        <div class="mb-4">
            <div class="grid grid-cols-12 gap-2 text-xs font-bold text-gray-400 uppercase tracking-wider pb-2 border-b border-gray-200">
                <span class="col-span-5">Shift Date & Details</span>
                <span class="col-span-2 text-right">Hours</span>
                <span class="col-span-2 text-right">Rate (£)</span>
                <span class="col-span-1 text-right">Exp</span>
                <span class="col-span-2 text-right">Total</span>
            </div>
            
            <div id="rows" class="space-y-3 mt-3">
                <!-- Starting Base Row Template -->
                <div class="grid grid-cols-12 gap-2 border-b border-gray-100 pb-2 items-center">
                    <input type="text" placeholder="e.g. 15th May - Day Shift" class="col-span-5 text-sm font-medium border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                    <input type="number" placeholder="0" step="0.25" oninput="calc()" class="col-span-2 text-right hrs text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                    <input type="number" placeholder="0" step="0.50" oninput="calc()" class="col-span-2 text-right rate text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                    <input type="number" placeholder="0" step="0.01" oninput="calc()" class="col-span-1 text-right exp text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                    <span class="col-span-2 text-right font-semibold text-sm total text-gray-700">£0.00</span>
                </div>
            </div>
        </div>

        <!-- Add Extra Dynamic Rows Line Toggle -->
        <button onclick="addRow()" class="no-print text-sm font-semibold text-blue-600 hover:text-blue-800 transition mb-6 flex items-center gap-1">
            ➕ Add Another Shift
        </button>

        <!-- Remittance Bank Data & Live Summary Target Box -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-gray-200">
            <div class="space-y-2 text-sm">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-1">Bank Remittance</span>
                <div class="flex items-center gap-2"><span class="w-20 text-xs text-gray-400 font-medium">Bank:</span><input type="text" id="bank" placeholder="e.g. Barclays" class="flex-1 border-b border-transparent hover:border-gray-200 outline-none bg-transparent text-gray-700"></div>
                <div class="flex items-center gap-2"><span class="w-20 text-xs text-gray-400 font-medium">Acc No:</span><input type="text" id="acc" placeholder="12345678" class="flex-1 font-mono border-b border-transparent hover:border-gray-200 outline-none bg-transparent text-gray-700"></div>
                <div class="flex items-center gap-2"><span class="w-20 text-xs text-gray-400 font-medium">Sort Code:</span><input type="text" id="sort" placeholder="00-00-00" class="flex-1 font-mono border-b border-transparent hover:border-gray-200 outline-none bg-transparent text-gray-700"></div>
            </div>
            <div class="flex justify-between items-center md:justify-end md:gap-4 self-end">
                <span class="text-gray-500 font-medium text-sm">Total Amount Due:</span>
                <span id="grand" class="text-2xl font-bold text-blue-600">£0.00</span>
            </div>
        </div>

    </div>

    <!-- Background Logic Mechanics Script Frame -->
    <script>
        // Set standard baseline auto current calendar execution date 
        document.getElementById('invDate').value = new Date().toISOString().split('T')[0];

        // Dynamic multi row appender sequence trigger
        function addRow() {
            const container = document.getElementById('rows');
            const div = document.createElement('div');
            div.className = "grid grid-cols-12 gap-2 border-b border-gray-100 pb-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="Shift Date/Description" class="col-span-5 text-sm font-medium border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                <input type="number" placeholder="0" step="0.25" oninput="calc()" class="col-span-2 text-right hrs text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                <input type="number" placeholder="0" step="0.50" oninput="calc()" class="col-span-2 text-right rate text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                <input type="number" placeholder="0" step="0.01" oninput="calc()" class="col-span-1 text-right exp text-sm border-b border-transparent hover:border-gray-200 focus:border-blue-500 outline-none bg-transparent">
                <span class="col-span-2 text-right font-semibold text-sm total text-gray-700">£0.00</span>
            `;
            container.appendChild(div);
        }

        // Mathematical dynamic calculator sequence tracking loop
        function calc() {
            let grand = 0;
            document.querySelectorAll('#rows > div').forEach(row => {
                const hrs = parseFloat(row.querySelector('.hrs').value) || 0;
                const rate = parseFloat(row.querySelector('.rate').value) || 0;
                const exp = parseFloat(row.querySelector('.exp').value) || 0;
                const lineTotal = (hrs * rate) + exp;
                row.querySelector('.total').innerText = '£' + lineTotal.toFixed(2);
                grand += lineTotal;
            });
            document.getElementById('grand').innerText = '£' + grand.toFixed(2);
        }

        // Automatic LocalStorage sync core mechanics loop 
        const inputs = ['name', 'gphc', 'address', 'bank', 'acc', 'sort'];
        inputs.forEach(id => {
